# Replaces Omarchy's stock lock screen. Colours come from the active theme, so
# this stays right under goud and gloed alike.
#
# The layout is shared with the boot splash and the login screen, and the boot
# splash is what sets it: its theme files are baked into the initramfs, so every
# change there costs a rebuild, and omarchy-plymouth-set overwrites its script on
# every sync anyway. Matching to it rather than the other way round costs nothing.
#
# Its two rules, from /usr/share/plymouth/themes/omarchy/omarchy.script:
#
#     the banner centred on the screen
#     the password box 40px below it, the padlock 15px left of that
#
# The banner is 162px tall and the box is 48, which puts the box 121px to 169px
# below centre. Every number below falls out of that; none of them are tuned.
source = ~/.config/omarchy/current/theme/hyprlock.conf

$font = FiraCode Nerd Font Mono

general {
    ignore_empty_input = true
    hide_cursor = true
}

background {
    monitor =
    color = $color
}

animations {
    enabled = false
}

# The theme's name as ASCII art, typed out one letter at a time.
# hyprlock cannot animate — an image is static and a label is a single line — but
# it will re-run a command on a timer, so each row is its own label and the
# reveal is driven off elapsed time. Rows are padded to equal width by the
# script; hyprlock centres each label independently and they would drift apart
# otherwise. The row count follows themes/<name>/ascii/logo.txt.
#
# 18px apart because that is a banner row in unlock.png: omaricethcy-ascii draws
# nine pixels per cell and two pixel rows per text row. font_size 11 renders at
# exactly that, so the two agree without rounding — see UNLOCK_CELL_PIXELS.

label {
    monitor =
    text = cmd[update:150] echo "$(omaricethcy-banner --lock-row 0)"
    color = $accent_color
    font_size = 11
    font_family = $font
    position = 0, 72
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:150] echo "$(omaricethcy-banner --lock-row 1)"
    color = $accent_color
    font_size = 11
    font_family = $font
    position = 0, 54
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:150] echo "$(omaricethcy-banner --lock-row 2)"
    color = $accent_color
    font_size = 11
    font_family = $font
    position = 0, 36
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:150] echo "$(omaricethcy-banner --lock-row 3)"
    color = $accent_color
    font_size = 11
    font_family = $font
    position = 0, 18
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:150] echo "$(omaricethcy-banner --lock-row 4)"
    color = $accent_color
    font_size = 11
    font_family = $font
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:150] echo "$(omaricethcy-banner --lock-row 5)"
    color = $accent_color
    font_size = 11
    font_family = $font
    position = 0, -18
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:150] echo "$(omaricethcy-banner --lock-row 6)"
    color = $accent_color
    font_size = 11
    font_family = $font
    position = 0, -36
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:150] echo "$(omaricethcy-banner --lock-row 7)"
    color = $accent_color
    font_size = 11
    font_family = $font
    position = 0, -54
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:150] echo "$(omaricethcy-banner --lock-row 8)"
    color = $accent_color
    font_size = 11
    font_family = $font
    position = 0, -72
    halign = center
    valign = center
}

# The padlock the other two screens draw, pointed at the file they draw it from.
# omarchy-plymouth-set tints that file with the theme's foreground on every sync,
# so it follows a theme switch without a second copy kept in step here.
image {
    monitor =
    path = /usr/share/plymouth/themes/omarchy/lock.png
    size = 38
    rounding = 0
    border_size = 0
    position = -175, -145
    halign = center
    valign = center
}

# entry.png, redrawn: 286x48, square, a hairline border and a barely-there fill.
# No placeholder text, because the other two screens show none.
input-field {
    monitor =
    size = 286, 48
    position = 0, -145
    halign = center
    valign = center

    inner_color = $entry_fill
    outer_color = $entry_border
    outline_thickness = 1

    font_family = $font
    font_color = $font_color

    placeholder_text =
    check_color = $accent_color
    fail_color = $fail_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = $caps_color

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = false
}
