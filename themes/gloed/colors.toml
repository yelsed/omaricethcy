# Omarchy 4 reads the semantic names; Omarchy 3 reads the ANSI slots below them.
# Both are written out and kept consistent by bin/omaricethcy-omarchy4 — do not
# edit one half without rerunning it.

# --- Omarchy 4 semantic palette ---------------------------------------------
mode               = "dark"

accent             = "#ff8c00"
selection          = "#7c1b00"
muted              = "#4a4541"

background         = "#181716"
dark_background    = "#121111"
darker_background  = "#0c0c0b"
lighter_background = "#2d2a27"

foreground         = "#f0e3d5"
dark_foreground    = "#4a4541"
light_foreground   = "#d3c4b4"
bright_foreground  = "#f0e3d5"

red                = "#ff3200"
yellow             = "#ffab40"
orange             = "#ff6a00"
green              = "#8a9d33"
cyan               = "#d63100"
blue               = "#ff6a00"
magenta            = "#ff8c00"
brown              = "#803500"

bright_red         = "#ff5c33"
bright_yellow      = "#ffc470"
bright_green       = "#a3b845"
bright_cyan        = "#ff6a00"
bright_blue        = "#ff8c00"
bright_magenta     = "#ffab40"

# --- Omarchy 3 palette ------------------------------------------------------
# cursor is read by Omarchy 3 only. Omarchy 4 assigns the cursor from
# bright_foreground unconditionally, so the accent-coloured cursor ends there.
cursor               = "#ffab40"
selection_foreground = "#f0e3d5"
selection_background = "#7c1b00"

color0  = "#2d2a27"
color1  = "#ff3200"
color2  = "#8a9d33"
color3  = "#ffab40"
color4  = "#ff6a00"
color5  = "#ff8c00"
color6  = "#d63100"
color7  = "#d3c4b4"
color8  = "#4a4541"
color9  = "#ff5c33"
color10 = "#a3b845"
color11 = "#ffc470"
color12 = "#ff8c00"
color13 = "#ffab40"
color14 = "#ff6a00"
color15 = "#f0e3d5"
