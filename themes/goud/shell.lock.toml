# The [lock] section of Omarchy's shell.toml. Spliced into it verbatim on every
# theme switch, so this stays short. Six colours is the whole surface the lock
# screen exposes; see the README for what that does and does not reach.

text             = "#ede4c8"
placeholder      = "#ede4c8"
text-error       = "#d85e40"
border           = "#e5c125"
border-active    = "#e5c125"
border-error     = "#d85e40"
