# Replaces the [bar] section of Omarchy 4's generated shell.toml. A section
# override replaces the whole section, so every key the generated one sets is
# repeated here even where the value is unchanged.

[bar]
background       = "#181716"
background-alpha = 1.0
text             = "#ede4c8"
# The generated bar colours attention modules (recording, alerts, updates) with
# `red`, which puts a second hue on a bar that otherwise carries none. Attention
# is the accent here, the same decision the quickshell bar made.
active           = "#e5c125"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28
